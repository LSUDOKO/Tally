[package]
name = "tally-litesvm"
version = "0.1.0"
description = "LiteSVM integration harness and threat-model test suite for the Tally program"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tally = { path = "../../programs/tally", features = ["no-entrypoint"] }
tally-core = { path = "../../crates/tally-core" }
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", features = ["token", "token_2022", "associated_token"] }
litesvm = { version = "0.17", features = ["precompiles"] }
litesvm-token = "0.17"
ed25519-dalek = "2"
solana-instruction = "3"
solana-instruction-error = "2"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3"
solana-clock = "3"
solana-sdk-ids = "3.1"
solana-compute-budget-interface = "3"

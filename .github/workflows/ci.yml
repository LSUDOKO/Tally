name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Program and core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-4.0.2
      - name: Install Solana CLI 4.0.2
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build program (SBF)
        run: cargo build-sbf --manifest-path programs/tally/Cargo.toml
      - name: Test (core, golden vectors, LiteSVM threat suite)
        run: cargo test --workspace

  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C sdk typecheck
      - run: pnpm -C sdk test
      - run: pnpm -C scripts typecheck

  android:
    name: Android (core tests + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (byte parity with Rust and the TS SDK)
        working-directory: app
        run: ./gradlew :core:test --console=plain
      - name: Build debug APK
        working-directory: app
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: tally-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk

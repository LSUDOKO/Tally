[package]
name = "tally"
version = "0.1.0"
description = "Tally: deterministic intent-to-execution binding for autonomous agent payments"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
anchor-debug = []
custom-heap = []
custom-panic = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.1", features = ["token", "token_2022", "associated_token"] }
tally-core = { path = "../../crates/tally-core" }
solana-sdk-ids = "3.1"
